<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giriş — LAL Commerce OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ecea;--ink:#0d2a30;--mute:#516a6e;--line:#0d2a3033;--err:#b3261e;--pad:clamp(20px,4vw,56px);--f:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0a1a1e;--ink:#e3eeec;--mute:#8aa3a6;--line:#e3eeec33;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.top{padding:22px var(--pad);font-size:14px;font-weight:500}.top a{text-decoration:none}.top span{color:var(--mute);font-weight:400;margin-left:.6em}
main{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(32px,7vw,120px);align-items:end;padding:0 var(--pad) clamp(40px,8vw,110px)}
h1{margin:0;font-weight:300;font-size:clamp(2.8rem,8vw,7.4rem);line-height:.98;letter-spacing:-.045em}
.lead{margin:1.4rem 0 0;color:var(--mute);max-width:34ch;line-height:1.5}
form{display:flex;flex-direction:column;gap:1.6rem;max-width:26rem;width:100%}
label{display:flex;flex-direction:column;gap:.5rem;font-size:14px;color:var(--mute)}
input{font:inherit;font-size:1.15rem;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:.55rem 0;border-radius:0}
input:focus{border-bottom-color:var(--ink)}
button{font:inherit;font-weight:500;font-size:1.05rem;background:var(--ink);color:var(--bg);border:0;padding:1rem 1.4rem;border-radius:4px;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.88}
.err{margin:0;color:var(--err);font-size:14px}
.back{padding:0 var(--pad) 28px;font-size:14px;color:var(--mute)}
@media (max-width:820px){main{grid-template-columns:1fr;align-items:start}}
</style>
</head>
<body>
<div class="top"><a href="/">LAL<span>Commerce OS</span></a></div>
<main>
<div>
<h1>Panele giriş.</h1>
<p class="lead">Siparişlerin, iadelerin ve net kârın giriş yaptıktan sonra seni bekliyor.</p>
</div>
<form method="post" action="/giris">
<input type="hidden" name="next" value="{{ next }}">
<label>Kullanıcı adı<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
<label>Parola<input type="password" name="password" autocomplete="current-password" required></label>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<button type="submit">Giriş yap</button>
</form>
</main>
<div class="back"><a href="/">Ana sayfaya dön</a></div>
</body>
</html>
